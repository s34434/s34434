<!DOCTYPE html>
<html lang="th">

<head>

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>PAKORNKIAD | Portfolio</title>

  <style>

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, sans-serif;
      transition: background 0.3s, color 0.3s, border 0.3s;
    }

    /* =========================
       LIGHT THEME
    ========================= */

    body {
      background: #ffffff;
      color: #222;
    }

    nav {
      height: 70px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 8%;
      border-bottom: 1px solid #eee;
      background: #ffffff;
    }

    .logo {
      font-size: 24px;
      font-weight: bold;
    }

    .logo span {
      color: #007bff;
    }

    nav a {
      text-decoration: none;
      color: #333;
      margin-left: 25px;
    }

    .hero {
      min-height: calc(100vh - 70px);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 60px 8%;
      gap: 50px;
    }

    .text {
      max-width: 600px;
    }

    .text small {
      color: #007bff;
      font-size: 18px;
    }

    h1 {
      font-size: 60px;
      margin: 15px 0;
    }

    h1 span {
      color: #007bff;
    }

    .text p {
      color: #666;
      font-size: 19px;
      line-height: 1.8;
      margin-bottom: 30px;
    }

    .btn {
      display: inline-block;
      background: #007bff;
      color: white;
      padding: 15px 30px;
      border-radius: 8px;
      text-decoration: none;
    }

    .photo img {
      width: 330px;
      height: 330px;
      object-fit: cover;
      border-radius: 20px;
    }

    /* =========================
       THEME BUTTON
    ========================= */

    .theme-btn {
      border: none;
      background: #222;
      color: white;
      padding: 10px 16px;
      border-radius: 20px;
      cursor: pointer;
      font-size: 15px;
      margin-left: 25px;
    }

    .theme-btn:hover {
      transform: scale(1.05);
    }


    /* =========================
       DARK THEME
    ========================= */

    body.dark {
      background: #111;
      color: #fff;
    }

    body.dark nav {
      background: #111;
      border-bottom: 1px solid #333;
    }

    body.dark nav a {
      color: #ddd;
    }

    body.dark .text p {
      color: #aaa;
    }

    body.dark .theme-btn {
      background: #fff;
      color: #111;
    }

  </style>

</head>


<body>


  <!-- =========================
       NAVBAR
  ========================= -->

  <nav>

    <div class="logo">
      PAKORN<span>KIAD</span>
    </div>

    <div>

      <a href="index.html">
        Home
      </a>

      <a href="portfolio.html">
        Portfolio
      </a>

      <!-- ปุ่มเปลี่ยนธีม -->
      <button class="theme-btn" onclick="changeTheme()" id="themeButton">
        🌙 Dark
      </button>

    </div>

  </nav>


  <!-- =========================
       HERO
  ========================= -->

  <section class="hero">

    <div class="text">

      <small>
        WELCOME TO MY PORTFOLIO
      </small>

      <h1>
        Hi, I'm <span>PAKORNKIAD</span>
      </h1>

      <p>
        สวัสดีครับ ผมเป็นคนที่สนใจด้านเทคโนโลยี
        การเขียนโปรแกรม และการออกแบบเว็บไซต์
        เว็บไซต์นี้รวบรวมประวัติและผลงานของผม
      </p>

      <a href="portfolio.html" class="btn">
        ดูผลงานของฉัน →
      </a>

    </div>


    <div class="photo">

      <img src="profile.jpg" alt="Profile">

    </div>

  </section>


  <!-- =========================
       JAVASCRIPT
  ========================= -->

  <script>

    function changeTheme() {

      document.body.classList.toggle("dark");

      const button = document.getElementById("themeButton");

      if (document.body.classList.contains("dark")) {

        button.innerHTML = "☀️ Light";

        localStorage.setItem("theme", "dark");

      } else {

        button.innerHTML = "🌙 Dark";

        localStorage.setItem("theme", "light");

      }

    }


    // จำธีมที่ผู้ใช้เลือกไว้
    window.onload = function() {

      const savedTheme = localStorage.getItem("theme");

      const button = document.getElementById("themeButton");

      if (savedTheme === "dark") {

        document.body.classList.add("dark");

        button.innerHTML = "☀️ Light";

      }

    };

  </script>


</body>

</html>
```
