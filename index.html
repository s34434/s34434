<!DOCTYPE html>

<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>ปกรณ์เกียรติ | Portfolio</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      font-family: "Segoe UI", Tahoma, sans-serif;

      background:
        radial-gradient(circle at top left, #3b1b70, transparent 40%),
        radial-gradient(circle at bottom right, #0f4c75, transparent 40%),
        #080817;

      color: white;

      display: flex;
      justify-content: center;
      align-items: center;

      padding: 30px;
    }

    .card {
      width: 100%;
      max-width: 650px;

      padding: 45px 40px;

      text-align: center;

      background: rgba(255, 255, 255, 0.08);

      border: 1px solid rgba(255, 255, 255, 0.15);

      border-radius: 25px;

      backdrop-filter: blur(15px);

      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.4);

      animation: fadeIn 1s ease;
    }

    /* รูปโปรไฟล์ */
    .profile-image {
      width: 160px;
      height: 160px;

      object-fit: cover;

      border-radius: 50%;

      border: 4px solid #a855f7;

      box-shadow:
        0 0 30px rgba(168, 85, 247, 0.5);

      margin-bottom: 25px;
    }

    h1 {
      font-size: 38px;
      margin-bottom: 15px;

      background: linear-gradient(
        90deg,
        #ffffff,
        #c084fc
      );

      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .line {
      width: 60px;
      height: 3px;

      margin: 20px auto;

      border-radius: 10px;

      background: linear-gradient(
        90deg,
        #8e2de2,
        #4a00e0
      );
    }

    .name {
      color: #c084fc;

      font-size: 23px;

      font-weight: bold;

      margin-bottom: 20px;
    }

    p {
      font-size: 17px;

      line-height: 1.8;

      color: #d1d5db;

      margin-bottom: 10px;
    }

    .highlight {
      color: #c084fc;
      font-weight: bold;
    }

    .btn {
      display: inline-block;

      margin-top: 30px;

      padding: 14px 30px;

      color: white;

      text-decoration: none;

      font-size: 16px;

      font-weight: bold;

      border-radius: 50px;

      background: linear-gradient(
        135deg,
        #8e2de2,
        #4a00e0
      );

      box-shadow:
        0 8px 25px rgba(74, 0, 224, 0.4);

      transition: 0.3s;
    }

    .btn:hover {
      transform: translateY(-4px);

      box-shadow:
        0 12px 35px rgba(142, 45, 226, 0.6);
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(30px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @media (max-width: 600px) {
      .card {
        padding: 35px 25px;
      }

      h1 {
        font-size: 30px;
      }

      .name {
        font-size: 20px;
      }

      p {
        font-size: 16px;
      }

      .profile-image {
        width: 130px;
        height: 130px;
      }
    }
  </style>

</head>

<body>

  <div class="card">
